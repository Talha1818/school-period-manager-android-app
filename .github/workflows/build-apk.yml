name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || FAILED=1
          echo "=========== ERROR SUMMARY ==========="
          grep -n -A 25 "What went wrong" build.log || true
          echo "=========== LAST 40 LINES ==========="
          tail -n 40 build.log
          if [ "$FAILED" = "1" ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: PeriodManager-apk
          path: app/build/outputs/apk/debug/app-debug.apk
